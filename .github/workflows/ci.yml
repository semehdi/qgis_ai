name: CI

# Every push to main publishes a GitHub release with the plugin zip, using the
# version in metadata.txt. The workflow fails if that version was already released,
# so bump `version=` in metadata.txt before merging to main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version-check:
    name: Check the version in metadata.txt is new
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from metadata.txt
        id: version
        run: |
          version=$(python3 -c "import configparser; c = configparser.ConfigParser(); c.read('metadata.txt', encoding='utf-8'); print(c.get('general', 'version').strip())")
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=metadata.txt::version=\"$version\" is not of the form X.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version in metadata.txt: $version"

      - name: Fail if this version was already released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error file=metadata.txt::Version $VERSION is already released. Bump version= in metadata.txt to publish a new release."
            exit 1
          fi
          echo "v$VERSION is new and will be released if all checks pass."

  lint:
    name: Lint and syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyflakes
        run: pip install pyflakes

      - name: Check for undefined names, unused imports and syntax errors
        run: pyflakes ./*.py tools/*.py tests/*.py

      - name: Check the code still parses on Python 3.8 (oldest Python in supported QGIS builds)
        run: |
          python - <<'EOF'
          import ast, glob, sys
          failed = False
          for path in sorted(glob.glob("*.py") + glob.glob("tools/*.py")):
              try:
                  ast.parse(open(path, encoding="utf-8").read(), path, feature_version=(3, 8))
              except SyntaxError as e:
                  print(f"::error file={path},line={e.lineno}::Not valid Python 3.8: {e.msg}")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: Check metadata.txt has the fields QGIS requires
        run: |
          python - <<'EOF'
          import configparser, sys
          cfg = configparser.ConfigParser()
          cfg.read("metadata.txt", encoding="utf-8")
          required = ["name", "qgisMinimumVersion", "description", "about", "version", "author"]
          missing = [k for k in required if not cfg.get("general", k, fallback="").strip()]
          if missing:
              print("::error file=metadata.txt::Missing fields: " + ", ".join(missing))
              sys.exit(1)
          print("metadata.txt OK, version", cfg.get("general", "version"))
          EOF

  qgis-tests:
    name: Plugin tests in QGIS ${{ matrix.qgis }} (Linux)
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # ltr = QGIS 3 LTR (Qt5), stable = QGIS 4 (Qt6)
        qgis: [ltr, stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the plugin against a mock AI server in headless QGIS
        run: |
          docker run --rm -v "$PWD":/plugin:ro -w /plugin qgis/qgis:${{ matrix.qgis }} \
            sh -c "QT_QPA_PLATFORM=offscreen python3 tests/run_tests.py"

  build:
    name: Build zip (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the plugin zip
        run: python tools/build_zip.py

      - name: Check the zip layout QGIS expects
        shell: bash
        run: |
          python -c "import zipfile, sys; names = zipfile.ZipFile('dist/qgis_assistant.zip').namelist(); need = ['qgis_assistant/__init__.py', 'qgis_assistant/metadata.txt', 'qgis_assistant/icon.svg', 'qgis_assistant/i18n/en.json', 'qgis_assistant/i18n/fr.json']; bad = [n for n in need if n not in names]; print('\n'.join(names)); sys.exit('missing: ' + ', '.join(bad) if bad else 0)"

      - name: Upload the zip as a build artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: qgis_assistant
          path: dist/qgis_assistant.zip

  release:
    name: Publish release v${{ needs.version-check.outputs.version }}
    needs: [version-check, lint, qgis-tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the tag and the release
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Download the zip that was built and checked above
        uses: actions/download-artifact@v4
        with:
          name: qgis_assistant
          path: dist

      - name: Create the GitHub release with the zip attached
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/qgis_assistant.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "QGIS Assistant v$VERSION" \
            --generate-notes
